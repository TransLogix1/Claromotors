<main id="contact">
    <div id="section-picture" style="background-image:url('images/contact_main.jpg')">
        <div class="dark-bg"><h2 class="reveal" data-reveal="fade-up">Kontakt</h2></div>
    </div>

    <div class="section-container">
        <section id="main">
            <div class="contact-container">

                <div class="contact-data">
                    <div class="contact-data-container reveal" data-reveal="fade-right">
                        <div class="contact-data-picture" style="background-image:url('images/contact-data-picture.jpg')"></div>
                        <div class="contact-data-info">
                            <p>Wojciech</p>
                        </div>
                        <div class="contact-data-info">
                            <a href="tel:517195097">517 195 097</a>
                            <a class="mail" href="mailto:biuro@claromotors.pl">biuro@claromotors.pl</a>
                        </div>
                    </div>
                </div>

                <div class="contact-form reveal" data-reveal="fade-left">
                    <div id="response-message"></div>
                    <form id="contactForm" novalidate>
                        <div class="form-row half">
                            <label for="fullname">Imię i nazwisko</label>
                            <input type="text" id="fullname" name="fullname" required>
                        </div>
                        <div class="form-row half">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-row half">
                            <label for="phone">Telefon</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="form-row half">
                            <label for="nip">NIP</label>
                            <input type="text" id="nip" name="nip">
                        </div>
                        <div class="form-row">
                            <label for="message">Treść wiadomości</label>
                            <textarea id="message" name="message" required></textarea>
                        </div>
                        <div class="form-row">
                            <label class="checkbox-container">
                                <input type="checkbox" id="consent" name="consent" required>
                                <span class="checkbox-custom"></span>
                                <span class="checkbox-info">Wyrażam zgodę na przetwarzanie moich danych osobowych przez Claro Motors.</span>
                            </label>
                        </div>
                        <div class="form-row">
                            <button type="submit">Wyślij</button>
                        </div>
                    </form>
                </div>

            </div>
        </section>
    </div>
</main>

<script src="enhancements.js" defer></script>
<script>
document.getElementById('cm-year').textContent = new Date().getFullYear();

/* Podstawowa walidacja formularza (front-end only).
   Wysyłka wymaga podpięcia backendu / usługi mailowej — patrz README. */
(function () {
    var form = document.getElementById('contactForm');
    var responseBox = document.getElementById('response-message');
    if (!form) return;

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var required = form.querySelectorAll('[required]');
        var valid = true;

        required.forEach(function (field) {
            field.classList.remove('error');
            if (field.type === 'checkbox' ? !field.checked : !field.value.trim()) {
                valid = false;
                field.classList.add('error');
            }
        });

        responseBox.style.display = 'block';
        if (!valid) {
            responseBox.classList.add('error');
            responseBox.textContent = 'Uzupełnij wymagane pola przed wysłaniem wiadomości.';
            return;
        }

        responseBox.classList.remove('error');
        responseBox.textContent = 'Dziękujemy! Wiadomość została przygotowana do wysyłki — podłącz backend, aby faktycznie ją dostarczyć.';
        form.reset();
    });
})();
</script>
